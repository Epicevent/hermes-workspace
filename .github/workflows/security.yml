# Phase 2.5-001: Secrets scanning CI
# Scans for leaked secrets on PR and push to main

name: Security Scan

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 started hard-failing without a GITLEAKS_LICENSE
      # (2026-07-20; the action's license gate, not a finding). The CLI needs
      # no license, so run the same scan directly.
      - name: Run Gitleaks (CLI)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.18.4
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1 --config .gitleaks.toml

      - name: Grep for common patterns (fallback)
        if: always()
        run: |
          echo "🔍 Scanning for common secret patterns..."

          # Patterns that indicate secrets
          PATTERNS=(
            "sk-[a-zA-Z0-9]{20,}"
            "sk-ant-"
            "ghp_[a-zA-Z0-9]{36}"
            "github_pat_"
            "gho_[a-zA-Z0-9]{36}"
            "PRIVATE KEY"
            "-----BEGIN RSA"
            "-----BEGIN OPENSSH"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.env*" . 2>/dev/null \
              | grep -v node_modules \
              | grep -v ".lock" \
              | grep -v dist \
              | grep -v "test-redaction" \
              | grep -v "diagnostics.ts" \
              | grep -v "placeholder" \
              | grep -v "# pragma: allowlist secret" \
              | grep -v "example\|sample\|fake\|dummy\|test\|mock" ; then
              echo "⚠️ Potential secret found matching: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "❌ Potential secrets detected! Please review and remove."
            exit 1
          fi

          echo "✅ No obvious secret patterns found"
