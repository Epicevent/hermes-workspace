name: Runtime Contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  runtime-contract:
    name: Build & smoke runtime image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR for pinned base
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk before runtime build
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes >/dev/null 2>&1 || true
          docker builder prune -af >/dev/null 2>&1 || true

      - name: Build runtime image without publishing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.runtime
          load: true
          push: false
          tags: hermes-runtime:contract
          build-args: |
            HERMES_WORKSPACE_GIT_SHA=${{ github.event.pull_request.head.sha }}
          cache-from: type=gha

      - name: Exercise runtime contract
        run: bash scripts/runtime-image-smoke.sh hermes-runtime:contract
